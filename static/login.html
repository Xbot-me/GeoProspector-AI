<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — GeoProspector AI</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: var(--bg-paper);
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 32px 28px;
      background: var(--bg-card);
      border: 1px solid var(--border-hairline);
      border-radius: var(--radius-md);
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .login-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .login-title {
      font-family: var(--font-header);
      font-size: 18px;
      font-weight: 700;
      color: var(--text-ink);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 12px;
      color: var(--text-muted);
    }
    .error-banner {
      display: none;
      padding: 8px 12px;
      margin-bottom: 16px;
      background: rgba(122, 59, 46, 0.1);
      border: 1px solid var(--stamp-rust);
      color: var(--stamp-rust);
      font-size: 12px;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .footer-links {
      margin-top: 20px;
      text-align: center;
      font-size: 12px;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
    }
    .footer-links a:hover {
      color: var(--accent-teal);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-title">GeoProspector AI</div>
      <div class="login-subtitle">Sign in to access manual outreach field-log</div>
    </div>
    
    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group" style="margin-bottom:14px;">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. admin" required autocomplete="username" autofocus style="width:100%;">
      </div>
      <div class="form-group" style="margin-bottom:18px;">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password" style="width:100%;">
      </div>
      <button type="submit" id="submitBtn" class="btn" style="width:100%; height:40px;">Sign In</button>
    </form>

    <div class="footer-links">
      <a href="/history">View Public Search Archive</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const errorBanner = document.getElementById('errorBanner');

    form.addEventListener('submit', async () => {
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value
          })
        });

        if (resp.ok) {
          submitBtn.textContent = 'Success! Redirecting...';
          setTimeout(() => {
            window.location.href = '/';
          }, 300);
        } else {
          const text = await resp.text();
          showError(text || 'Invalid username or password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        showError('Network error. Could not connect to server.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }
  </script>
</body>
</html>
