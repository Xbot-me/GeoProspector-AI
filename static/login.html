<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Maps Outreach Agent</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔒</text></svg>">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background: radial-gradient(circle at 50% 30%, rgba(6, 182, 212, 0.15) 0%, rgba(6, 9, 15, 1) 70%);
      overflow: hidden;
    }
    .login-card {
      width: 100%;
      max-width: 400px;
      padding: 36px 32px;
      background: rgba(17, 24, 39, 0.75);
      border: 1px solid rgba(34, 211, 238, 0.25);
      border-radius: var(--radius-lg);
      backdrop-filter: blur(24px);
      box-shadow: 0 12px 48px rgba(0, 0, 0, 0.6);
      animation: floatIn 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes floatIn {
      0% { transform: translateY(20px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .login-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo {
      font-size: 2.5rem;
      margin-bottom: 12px;
      display: inline-block;
      filter: drop-shadow(0 0 12px rgba(6, 182, 212, 0.6));
    }
    .login-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;
    }
    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      background: rgba(12, 18, 32, 0.8);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      font-size: 0.95rem;
      outline: none;
      transition: var(--transition);
    }
    .form-group input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
    }
    .btn-submit {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      background: linear-gradient(135deg, #06b6d4, #3b82f6);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 16px rgba(6, 182, 212, 0.3);
    }
    .btn-submit:hover {
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .error-banner {
      display: none;
      padding: 10px 14px;
      margin-bottom: 16px;
      background: rgba(239, 68, 68, 0.15);
      border: 1px solid rgba(239, 68, 68, 0.4);
      color: #f87171;
      font-size: 0.85rem;
      border-radius: var(--radius-sm);
      text-align: center;
    }
    .footer-links {
      margin-top: 24px;
      text-align: center;
      font-size: 0.8rem;
    }
    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: var(--transition);
    }
    .footer-links a:hover {
      color: var(--text-accent);
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="login-logo">🗺️</div>
      <div class="login-title">Maps Outreach Agent</div>
      <div class="login-subtitle">Sign in to manage your automated B2B campaigns</div>
    </div>
    
    <div id="errorBanner" class="error-banner"></div>

    <form id="loginForm" onsubmit="return false;">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="e.g. admin" required autocomplete="username" autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="••••••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" id="submitBtn" class="btn-submit">Sign In</button>
    </form>

    <div class="footer-links">
      <a href="/history">🌐 View Public Search Archive</a>
    </div>
  </div>

  <script>
    const form = document.getElementById('loginForm');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const errorBanner = document.getElementById('errorBanner');

    form.addEventListener('submit', async () => {
      errorBanner.style.display = 'none';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput.value.trim(),
            password: passwordInput.value
          })
        });

        if (resp.ok) {
          submitBtn.textContent = 'Success! Redirecting...';
          submitBtn.style.background = 'linear-gradient(135deg, #10b981, #059669)';
          setTimeout(() => {
            window.location.href = '/';
          }, 400);
        } else {
          const text = await resp.text();
          showError(text || 'Invalid username or password.');
          submitBtn.disabled = false;
          submitBtn.textContent = 'Sign In';
        }
      } catch (err) {
        showError('Network error. Could not connect to authentication server.');
        submitBtn.disabled = false;
        submitBtn.textContent = 'Sign In';
      }
    });

    function showError(msg) {
      errorBanner.textContent = msg;
      errorBanner.style.display = 'block';
    }
  </script>
</body>
</html>
