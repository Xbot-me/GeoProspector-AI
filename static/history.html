<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Public Search Archive — GeoProspector AI</title>
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
</head>
<body>

  <!-- ── Top Header ─────────────────────────────────────────── -->
  <header class="header">
    <div class="header__brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="2" y1="12" x2="22" y2="12"></line>
        <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
      </svg>
      Public Search Archive
    </div>
    <div class="header__actions">
      <a href="/" class="btn btn--sm">
        New Search Workbench
      </a>
    </div>
  </header>

  <main class="container">

    <!-- ── Filter & Header Panel ──────────────────────────────── -->
    <section class="ledger-panel">
      <div class="ledger-panel__title">
        <span>Search Run Ledger</span>
        <span id="runsCount" class="mono" style="font-size:12px; color:var(--text-muted);">Loading...</span>
      </div>
      <div style="display: flex; gap: 12px; align-items: center;">
        <input type="text" id="filterInput" placeholder="Filter search runs by query or location (e.g. Dhaka, Austin, plumbers)..." style="flex:1;">
        <button class="btn btn--outline" id="btnRefresh">
          Refresh
        </button>
      </div>
    </section>

    <!-- ── Runs Ledger Container ───────────────────────────────── -->
    <section class="ledger-panel">
      <div id="runsContainer">
        <div style="text-align:center; padding:32px; color:var(--text-muted);">
          Loading search run history...
        </div>
      </div>
    </section>

    <!-- ── Enriched Leads Details Modal/Section ───────────────── -->
    <section class="ledger-panel hidden" id="leadsSection">
      <div class="ledger-panel__title">
        <span id="leadsTitle">Enriched Leads</span>
        <div style="display: flex; gap: 8px;">
          <button class="btn btn--outline btn--sm" id="btnExportRunCsv">Export CSV</button>
          <button class="btn btn--rust btn--sm" id="btnCloseLeads">Close</button>
        </div>
      </div>
      <div id="leadsContent"></div>
    </section>

  </main>

  <script src="/static/history.js"></script>
</body>
</html>
