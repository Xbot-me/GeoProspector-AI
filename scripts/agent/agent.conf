# scripts/agent configuration (read by _lib.sh). Edit, then try: bash scripts/agent/test.sh --all
CACHE_REL=".agent-cache"
TEST_DIR="."
# Interpreter with requirements-dev.txt installed: $PYTHON, else ./venv or ./.venv, else python
PY="${PYTHON:-}"
for cand in venv/Scripts/python.exe venv/bin/python .venv/Scripts/python.exe .venv/bin/python; do
  [ -z "$PY" ] && [ -x "$ROOT/$cand" ] && PY="$ROOT/$cand"
done
PY="${PY:-python}"
TEST_CMD="\"$PY\" -m compileall -q -x '(venv|scripts|tests)' . && node --check static/app.js && node --check static/history.js && \"$PY\" -m pytest -q -p no:cacheprovider tests"
TEST_FORMAT="pytest"
BUILD_APPS=""
BUILD_CMD=""   # no build step: app runs from source; Docker image is built on the VPS by deploy.yml
HANDOFF_FILE="docs/HANDOFF.md"
PLANS_DIR=""
FP_EXCLUDES=""
WHERE_EXCLUDES=":!static/style.css"
